<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="自動更新流程：檢查補檔、快照、升級、煙霧測試、pip check、失敗回滾"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0d1117" stroke="#263244" stroke-width="1.5"/><text x="40" y="42" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" fill="#e6edf3" font-weight="700" text-anchor="start">自動更新與回滾流程</text><text x="40" y="66" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">任何一步失敗，都會回到升級前的快照版本</text><rect x="40" y="92" width="520" height="64" rx="12" fill="#111827" stroke="#263244" stroke-width="1"/><circle cx="72" cy="124" r="16" fill="#22d3ee"/><text x="72" y="129" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="13" fill="#001018" font-weight="700" text-anchor="middle">1</text><text x="100" y="119" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600" text-anchor="start">檢查＋補檔</text><text x="100" y="139" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">check_stack.py --runtime · 缺 cuDNN 檔 → 提權工作補齊</text><line x1="300" y1="156" x2="300" y2="168" stroke="#22d3ee" stroke-width="2"/><path d="M 295 167 L 300 176 L 305 167" fill="#22d3ee"/><rect x="40" y="176" width="520" height="64" rx="12" fill="#111827" stroke="#263244" stroke-width="1"/><circle cx="72" cy="208" r="16" fill="#22d3ee"/><text x="72" y="213" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="13" fill="#001018" font-weight="700" text-anchor="middle">2</text><text x="100" y="203" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600" text-anchor="start">pip freeze 快照</text><text x="100" y="223" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">記錄環境中每一個套件的版本</text><line x1="300" y1="240" x2="300" y2="252" stroke="#22d3ee" stroke-width="2"/><path d="M 295 251 L 300 260 L 305 251" fill="#22d3ee"/><rect x="40" y="260" width="520" height="64" rx="12" fill="#111827" stroke="#263244" stroke-width="1"/><circle cx="72" cy="292" r="16" fill="#60a5fa"/><text x="72" y="297" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="13" fill="#001018" font-weight="700" text-anchor="middle">3</text><text x="100" y="287" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600" text-anchor="start">pip install --upgrade</text><text x="100" y="307" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">只升級 check_stack 回報的套件</text><line x1="300" y1="324" x2="300" y2="336" stroke="#22d3ee" stroke-width="2"/><path d="M 295 335 L 300 344 L 305 335" fill="#22d3ee"/><rect x="40" y="344" width="520" height="64" rx="12" fill="#111827" stroke="#263244" stroke-width="1"/><circle cx="72" cy="376" r="16" fill="#60a5fa"/><text x="72" y="381" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="13" fill="#001018" font-weight="700" text-anchor="middle">4</text><text x="100" y="371" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600" text-anchor="start">GPU 煙霧測試</text><text x="100" y="391" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">import torch + matmul + cuDNN 卷積 + 關鍵套件</text><line x1="300" y1="408" x2="300" y2="420" stroke="#22d3ee" stroke-width="2"/><path d="M 295 419 L 300 428 L 305 419" fill="#22d3ee"/><rect x="40" y="428" width="520" height="64" rx="12" fill="#111827" stroke="#263244" stroke-width="1"/><circle cx="72" cy="460" r="16" fill="#d29922"/><text x="72" y="465" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="13" fill="#001018" font-weight="700" text-anchor="middle">5</text><text x="100" y="455" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="14.5" fill="#e6edf3" font-weight="600" text-anchor="start">pip check + 判定</text><text x="100" y="475" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">依賴破損或煙霧測試失敗？</text><rect x="620" y="388" width="300" height="56" rx="10" fill="#0d1f16" stroke="#1f6f3d" stroke-width="1"/><text x="638" y="410" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="13.5" fill="#3fb950" font-weight="700" text-anchor="start">PASS：保留升級</text><text x="638" y="429" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="start">toast「N 個套件已自動更新」</text><rect x="620" y="456" width="300" height="60" rx="10" fill="#2a0f12" stroke="#7d2b33" stroke-width="1"/><text x="638" y="478" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="13.5" fill="#f85149" font-weight="700" text-anchor="start">FAIL：回滾</text><text x="638" y="497" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="start">還原快照 → 再測 → toast 警示</text><line x1="560" y1="456" x2="612" y2="416" stroke="#3fb950" stroke-width="2"/><path d="M 611 411 L 620 416 L 611 421" fill="#3fb950"/><line x1="560" y1="466" x2="612" y2="486" stroke="#f85149" stroke-width="2"/><path d="M 611 481 L 620 486 L 611 491" fill="#f85149"/><text x="40" y="530" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="start">※ 選用 -Bench：升級前後各跑一次 GPU 效能基準（cuBLAS／cuDNN／HF 基線），寫進 bench_delta</text></svg>