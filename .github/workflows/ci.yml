name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile scripts
        run: python -m py_compile scripts/check_stack.py scripts/auto_update.py

      - name: Offline version check
        run: python scripts/check_stack.py --no-network

      - name: JSON report + dry-run planner
        run: |
          python scripts/check_stack.py --no-network --json-out report.json
          python scripts/auto_update.py --report report.json --dry-run

      - name: Validate JSON shape
        run: |
          python -c "import json; d=json.load(open('report.json', encoding='utf-8')); assert 'rows' in d and 'updates' in d and len(d['rows']) >= 10; print('rows:', len(d['rows']))"
